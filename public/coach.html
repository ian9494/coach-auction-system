<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach - Auction</title>
  <link rel="stylesheet" href="./coach.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="label">教練競標端</p>
      <h1 id="coachTitle">Coach</h1>
    </header>

    <section class="card player-card">
      <p class="label">目前競標選手</p>
      <h2 id="playerText">-</h2>

      <div class="info-grid">
        <div>
          <p class="label">剩餘時間</p>
          <p class="value" id="timeText">-</p>
        </div>
        <div>
          <p class="label">剩餘預算</p>
          <p class="value" id="budgetText">-</p>
        </div>
      </div>

      <p class="status" id="statusText">等待開始</p>
    </section>

    <section class="card">
      <p class="label">你的目前出價</p>
      <p class="my-bid" id="myBidText">尚未出價</p>

      <input id="bidInput" class="bid-input" type="number" min="0" placeholder="輸入出價金額" />

      <div class="quick-buttons">
        <button type="button" data-add="50">+50</button>
        <button type="button" data-add="100">+100</button>
        <button type="button" data-add="500">+500</button>
      </div>

      <button id="submitBtn" class="submit-btn">送出 / 修改出價</button>
    </section>

    <p id="messageText" class="message"></p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./coach.js"></script>
</body>
</html>
