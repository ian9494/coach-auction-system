<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer - Coach Auction System</title>
  <link rel="stylesheet" href="./viewer.css" />
</head>
<body>
  <!-- 活動 Logo 預留空間 -->
  <main class="overlay">
    <section class="top-info">
      <div class="current-player-box">
        <img id="currentPlayerAvatar" class="player-avatar-large" alt="Player Image" />
        <div>
          <p class="label">目前競標選手</p>
          <h1 id="currentPlayerText">-</h1>
        </div>
      </div>

      <div class="timer-box">
        <p class="label">剩餘時間</p>
        <h2 id="timeLeftText">-</h2>
      </div>
    </section>

    <section id="runningSection" class="coach-grid"></section>

    <section id="resultSection" class="result-section hidden">
      <div id="teamGridContainer" class="team-grid-container"></div>
    </section>
  </main>

  <div id="rosterOverlay" class="roster-overlay hidden">
    <div class="roster-card">
      <p class="label">最新隊伍名單</p>
      <h2 id="rosterCoachName">-</h2>
      <div id="rosterMemberList" class="member-list"></div>
    </div>
  </div>

  <!-- 贊助商 Logo 預留空間 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>
