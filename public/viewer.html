<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer - Coach Auction System</title>
  <link rel="stylesheet" href="./viewer.css" />
</head>
<body>
  <main class="overlay">
    <section class="top-info">
      <div>
        <p class="label">目前競標選手</p>
        <h1 id="currentPlayerText">-</h1>
      </div>

      <div class="timer-box">
        <p class="label">剩餘時間</p>
        <h2 id="timeLeftText">-</h2>
      </div>
    </section>

    <section id="runningSection" class="coach-grid"></section>

    <section id="resultSection" class="result-section hidden">
      <p class="label">得標結果</p>
      <h1 id="winnerText">-</h1>
      <h2 id="winningAmountText">-</h2>
    </section>
  </main>

  <!-- 把動畫遮罩移到 main 之外，確保全螢幕顯示 -->
  <div id="rosterOverlay" class="roster-overlay hidden">
    <div class="roster-card">
      <p class="label">目前隊員組合</p>
      <h2 id="rosterCoachName">-</h2>
      <div id="rosterMemberList" class="member-list">
        <!-- 隊員將動態填入 -->
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./viewer.js"></script>
</body>
</html>
