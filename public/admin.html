<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Coach Auction System</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <h1>競標管理端</h1>

  <section>
    <h2>競標控制</h2>

    <div style="display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap;">
      <label style="flex: 1; min-width: 250px;">
        選手名稱
        <input id="playerNameInput" type="text" placeholder="輸入或從下方選擇選手" />
      </label>

      <label style="width: 120px;">
        競標秒數
        <input id="durationInput" type="number" value="90" min="1" />
      </label>

      <div style="margin-bottom: 8px;">
        <button id="startButton">開始競標</button>
        <button id="endButton">強制結束</button>
      </div>
    </div>

    <div id="memberButtonContainer">
      <!-- 選手按鈕將由 JS 動態生成 -->
    </div>
  </section>

  <section>
    <h2>目前狀態</h2>
    <div class="status-grid">
      <div class="status-item">
        <div class="status-label">狀態</div>
        <div id="statusText" class="status-value">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">目前選手</div>
        <div id="currentPlayerText" class="status-value">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">剩餘時間</div>
        <div id="timeLeftText" class="status-value">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">得標者</div>
        <div id="winnerText" class="status-value">-</div>
      </div>
      <div class="status-item">
        <div class="status-label">金額</div>
        <div id="winningAmountText" class="status-value">-</div>
      </div>
    </div>
  </section>

  <section>
    <h2>出價狀況</h2>
    <ul id="bidList"></ul>
  </section>

  <div id="messageText"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
