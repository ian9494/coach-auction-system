<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Coach Auction System</title>
</head>
<body>
  <h1>競標管理端</h1>

  <section>
    <h2>開始競標</h2>

    <label>
      選手名稱：
      <input id="playerNameInput" type="text" placeholder="輸入選手名稱" />
    </label>

    <br /><br />

    <label>
      競標秒數：
      <input id="durationInput" type="number" value="90" min="1" />
    </label>

    <br /><br />

    <button id="startButton">開始競標</button>
    <button id="endButton">強制結束</button>
  </section>

  <hr />

  <section>
    <h2>目前狀態</h2>
    <p>狀態：<span id="statusText">-</span></p>
    <p>目前選手：<span id="currentPlayerText">-</span></p>
    <p>剩餘時間：<span id="timeLeftText">-</span></p>
    <p>得標者：<span id="winnerText">-</span></p>
    <p>得標金額：<span id="winningAmountText">-</span></p>
  </section>

  <hr />

  <section>
    <h2>目前出價</h2>
    <ul id="bidList"></ul>
  </section>

  <p id="messageText"></p>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
