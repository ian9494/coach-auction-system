<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>競標結果 - Coach Auction System</title>
  <link rel="stylesheet" href="./results.css" />
</head>
<body class="results-transparent">
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("background") === "colored") {
      document.body.classList.replace("results-transparent", "results-colored");
    }
    // ?fill=80  → 框底色透明度 80%（0-100，預設 80）
    const fill = parseFloat(params.get("fill"));
    if (!Number.isNaN(fill)) {
      document.documentElement.style.setProperty("--fill-op", Math.min(Math.max(fill, 0), 100) / 100);
    }
    // ?font=1.3 → 字體放大 1.3 倍（預設 1）
    const font = parseFloat(params.get("font"));
    if (!Number.isNaN(font) && font > 0) {
      document.documentElement.style.setProperty("--fs", font);
    }
  </script>
  <!-- 活動 Logo 預留空間 -->
  <div class="event-logo-container">
    <span style="color: rgba(255,255,255,0.3); font-size: 14px;">EVENT LOGO</span>
  </div>

  <div id="loading" class="loading">載入競標結果中...</div>

  <main class="results-overlay">
    <div id="grid" class="grid-container"></div>
  </main>

  <script src="./results.js"></script>
</body>
</html>
